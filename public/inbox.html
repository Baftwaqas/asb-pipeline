<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASB Inbox</title>
<style>
  /* ---------------------------------------------------------------
     One file, no CDN, no build. Runs on the free Render instance.
     --------------------------------------------------------------- */
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --panel-2: #f7f8fa;
    --line: #e3e6ea;
    --ink: #111b21;
    --ink-2: #667781;
    --green: #00733e;
    --green-soft: #d9fdd3;
    --accent: #1a7f4b;
    --warn: #b54708;
    --warn-bg: #fff6ed;
    --danger: #b42318;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b141a; --panel: #111b21; --panel-2: #182229; --line: #222e35;
      --ink: #e9edef; --ink-2: #8696a0; --green: #21c063; --green-soft: #005c4b;
      --accent: #21c063; --warn: #f0b27a; --warn-bg: #2a1f14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b141a; --panel: #111b21; --panel-2: #182229; --line: #222e35;
    --ink: #e9edef; --ink-2: #8696a0; --green: #21c063; --green-soft: #005c4b;
    --accent: #21c063; --warn: #f0b27a; --warn-bg: #2a1f14;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- login ---------- */
  #login {
    display: grid; place-items: center; height: 100%; padding: 16px;
  }
  #login form {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 340px;
    box-shadow: 0 1px 3px rgb(0 0 0 / .08);
  }
  #login h1 { margin: 0 0 4px; font-size: 20px; }
  #login p { margin: 0 0 20px; color: var(--ink-2); font-size: 13px; }
  .field {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel-2); color: var(--ink);
    font: inherit; margin-bottom: 12px;
  }
  .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn {
    width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .err { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 18px; }

  /* ---------- shell ---------- */
  #app { display: none; height: 100%; }
  #app.on { display: grid; grid-template-columns: 340px 1fr; }
  /* Grid and flex children default to min-width:auto, which lets a long
     message push the whole column wider than the screen and clip the right
     edge of every bubble. Both panels have to be told they may shrink. */
  #app.on > * { min-width: 0; }
  @media (max-width: 820px) {
    #app.on { grid-template-columns: 1fr; }
    #list.hide-mobile { display: none; }
    #thread.hide-mobile { display: none; }
  }

  /* ---------- conversation list ---------- */
  #list {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .list-head {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .list-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .pill {
    background: var(--accent); color: #fff; border-radius: 999px;
    padding: 1px 8px; font-size: 12px; font-weight: 700;
  }
  .ghost {
    background: transparent; border: 1px solid var(--line); color: var(--ink-2);
    border-radius: 7px; padding: 5px 9px; font-size: 12px;
  }
  .ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #convs { overflow-y: auto; flex: 1; min-height: 0; }
  .conv {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px;
    color: inherit;
  }
  .conv:hover { background: var(--panel-2); }
  .conv[aria-current="true"] { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .conv-top { display: flex; align-items: baseline; gap: 8px; }
  .conv-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-time { font-size: 11px; color: var(--ink-2); flex: none; }
  .conv-prev {
    color: var(--ink-2); font-size: 13px; margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  /* Only the preview text flexes. This selector used to be `.conv-prev span`,
     which also matched the unread badge and stretched it across the row. */
  .conv-prev > .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .badge {
    background: var(--accent); color: #fff; border-radius: 999px;
    min-width: 19px; height: 19px; font-size: 11px; font-weight: 700;
    display: grid; place-items: center; padding: 0 5px; flex: none;
  }
  .shut { color: var(--ink-2); font-size: 11px; flex: none; }

  /* ---------- thread ---------- */
  #thread { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .th-head {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  }
  .back { display: none; background: none; border: 0; color: var(--ink); font-size: 20px; padding: 0 4px; }
  @media (max-width: 820px) { .back { display: block; } }
  .th-head h3 { margin: 0; font-size: 15px; }
  .th-head small { color: var(--ink-2); font-size: 12px; display: block; }
  .win {
    margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green); font-weight: 600; flex: none;
  }
  .win.off { background: var(--warn-bg); color: var(--warn); }

  .ctx {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 14px; font-size: 12px; color: var(--ink-2);
    display: flex; gap: 14px; overflow-x: auto;
  }
  .ctx b { color: var(--ink); font-weight: 600; }

  #msgs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 14px; min-height: 0; min-width: 0; }
  .msg { max-width: min(78%, 560px); margin-bottom: 8px; }
  .msg.out { margin-left: auto; }
  .bub {
    padding: 7px 11px 5px; border-radius: var(--radius);
    background: var(--panel); word-wrap: break-word; white-space: pre-wrap;
    box-shadow: 0 1px 1px rgb(0 0 0 / .07);
  }
  .msg.out .bub { background: var(--green-soft); }
  .bub[dir="rtl"] { text-align: right; font-size: 16px; }
  .meta { font-size: 10.5px; color: var(--ink-2); margin-top: 3px; text-align: right; }
  .msg.in .meta { text-align: left; }
  .tmpl {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-2); margin-bottom: 3px; font-weight: 700;
  }
  .bub img { max-width: 100%; border-radius: 7px; display: block; }
  .bub audio { width: 260px; max-width: 100%; }
  .day {
    text-align: center; font-size: 11px; color: var(--ink-2);
    margin: 14px 0 10px; text-transform: uppercase; letter-spacing: .06em;
  }

  /* ---------- composer ---------- */
  .comp { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px; }
  .comp-row { display: flex; gap: 8px; align-items: flex-end; }
  #box {
    flex: 1; resize: none; min-height: 42px; max-height: 140px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 20px;
    background: var(--panel-2); color: var(--ink); font: inherit;
  }
  #box:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #box:disabled { opacity: .5; }
  #send {
    border: 0; border-radius: 50%; width: 42px; height: 42px; flex: none;
    background: var(--accent); color: #fff; font-size: 17px;
  }
  #send:disabled { opacity: .4; cursor: default; }
  .quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .quick button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 5px 11px; font-size: 12.5px; white-space: nowrap;
  }
  .closed {
    background: var(--warn-bg); color: var(--warn); border-radius: 8px;
    padding: 9px 11px; font-size: 12.5px; margin-bottom: 9px;
  }
  .closed b { display: block; margin-bottom: 2px; }
  .empty { display: grid; place-items: center; height: 100%; color: var(--ink-2); text-align: center; padding: 24px; }
  .empty[hidden] { display: none; }

  /* #threadView needs display:flex when shown, so [hidden] has to be given a
     rule of its own — an inline display style beats the `hidden` attribute and
     the thread would render on top of the placeholder. */
  #threadView { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  #threadView[hidden] { display: none; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #111b21; color: #fff; padding: 9px 15px; border-radius: 8px;
    font-size: 13px; z-index: 50; max-width: 90vw; box-shadow: 0 4px 14px rgb(0 0 0 / .3);
  }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <form id="loginForm">
    <h1>ASB Inbox</h1>
    <p>Apna Sasta Bazaar &middot; WhatsApp</p>
    <input class="field" type="text" id="who" placeholder="Your name (waqas / nadeem)" autocomplete="username">
    <input class="field" type="password" id="pw" placeholder="Inbox password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- ======================= APP ======================= -->
<div id="app">
  <aside id="list">
    <div class="list-head">
      <h2>Chats</h2>
      <span class="pill" id="unreadPill" hidden>0</span>
      <button class="ghost" id="filterBtn" aria-pressed="false">Unread</button>
      <button class="ghost" id="themeBtn" title="Switch light / dark">Theme</button>
      <button class="ghost" id="outBtn">Exit</button>
    </div>
    <div id="convs"></div>
  </aside>

  <main id="thread" class="hide-mobile">
    <div class="empty" id="placeholder">
      <div>
        <p style="font-size:34px;margin:0">💬</p>
        <p>Pick a conversation.<br>New customer messages appear here automatically.</p>
      </div>
    </div>

    <div id="threadView" hidden>
      <div class="th-head">
        <button class="back" id="backBtn" aria-label="Back">‹</button>
        <div style="min-width:0">
          <h3 id="tName">—</h3>
          <small id="tPhone"></small>
        </div>
        <span class="win" id="tWin">—</span>
      </div>
      <div class="ctx" id="tCtx" hidden></div>
      <div id="msgs"></div>
      <div class="comp">
        <div id="closedNote" hidden></div>
        <div class="quick" id="quick"></div>
        <div class="comp-row">
          <textarea id="box" rows="1" placeholder="Type a reply…"></textarea>
          <button id="send" aria-label="Send">➤</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ===========================================================================
// ASB Inbox — client
//
// Deliberately plain: fetch + DOM. No framework, so the free Render instance
// serves one small file and the page works on a slow Karachi mobile connection.
//
// State lives in these four variables and nowhere else.
// ===========================================================================
const S = {
  convs: [],
  phone: null,          // open conversation
  agent: 'asb',
  unreadOnly: false,
  polling: null,
};

const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401 && !path.endsWith('/login')) { showLogin(); throw new Error('Signed out'); }
  return { ok: res.ok, status: res.status, data };
};

// localStorage is a per-browser convenience here (name + theme only). It is
// wrapped because private windows and locked-down mobile browsers throw.
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

function toast(msg, ms = 3600) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// Urdu, Arabic and Roman-Urdu-with-Urdu-script all need RTL. Detecting the
// script beats asking anyone to pick a language.
const RTL = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
const dirOf = (s) => (RTL.test(s || '') ? 'rtl' : 'ltr');

const TYPE_ICON = {
  image: '🖼', audio: '🎤', video: '🎬', document: '📄',
  location: '📍', sticker: '🌟', button: '👆', interactive: '👆',
  order: '🛒', reaction: '❤️',
};

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('en-PK', { hour: 'numeric', minute: '2-digit' });
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-PK', { day: 'numeric', month: 'short' });
}

function fmtWindow(mins, open) {
  if (!open) return 'Template only';
  if (mins == null) return '—';
  if (mins < 60) return `${mins}m left`;
  return `${Math.floor(mins / 60)}h left`;
}

// ===========================================================================
// LOGIN
// ===========================================================================
function showLogin() {
  $('app').classList.remove('on');
  $('login').style.display = 'grid';
  clearInterval(S.polling);
}
function showApp() {
  $('login').style.display = 'none';
  $('app').classList.add('on');
  loadConvs();
  clearInterval(S.polling);
  // 12s is a compromise: fast enough that a customer waiting on the other end
  // does not notice, slow enough that the free Render instance and the free
  // Postgres tier are not hammered all day.
  S.polling = setInterval(tick, 12000);
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const btn = e.target.querySelector('button');
  btn.disabled = true;

  S.agent = ($('who').value || 'asb').trim().toLowerCase().slice(0, 40) || 'asb';
  store.set('asb_agent', S.agent);

  const { ok, data } = await api('/api/inbox/login', {
    method: 'POST',
    body: JSON.stringify({ password: $('pw').value }),
  });
  btn.disabled = false;

  if (!ok) { $('loginErr').textContent = data?.error || 'Could not sign in'; return; }
  $('pw').value = '';
  showApp();
});

$('outBtn').addEventListener('click', async () => {
  await api('/api/inbox/logout', { method: 'POST' });
  showLogin();
});

// ===========================================================================
// THEME
// ===========================================================================
(function initTheme() {
  const saved = store.get('asb_theme', null);
  if (saved) document.documentElement.dataset.theme = saved;
})();
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('asb_theme', next);
});

// ===========================================================================
// CONVERSATION LIST
// ===========================================================================
async function loadConvs() {
  const { ok, data } = await api(
    '/api/inbox/conversations' + (S.unreadOnly ? '?unread=1' : '')
  );
  if (!ok) return;
  S.convs = data.conversations || [];
  renderConvs(data.totalUnread || 0);
}

function renderConvs(totalUnread) {
  const pill = $('unreadPill');
  pill.hidden = !totalUnread;
  pill.textContent = totalUnread;
  document.title = totalUnread ? `(${totalUnread}) ASB Inbox` : 'ASB Inbox';

  const box = $('convs');
  if (!S.convs.length) {
    box.innerHTML = `<p style="padding:22px 16px;color:var(--ink-2);font-size:13.5px">
      ${S.unreadOnly ? 'Nothing unread.' : 'No conversations yet. They appear as soon as a customer messages the business number.'}
    </p>`;
    return;
  }

  box.innerHTML = '';
  for (const c of S.convs) {
    const b = document.createElement('button');
    b.className = 'conv';
    b.setAttribute('aria-current', String(c.phone === S.phone));

    const icon = TYPE_ICON[c.last_type] || '';
    const arrow = c.last_direction === 'outbound' ? '↗ ' : '';
    const name = c.display_name || '+' + c.phone;

    b.innerHTML = `
      <div class="conv-top">
        <span class="conv-name"></span>
        <span class="conv-time">${fmtTime(c.last_at)}</span>
      </div>
      <div class="conv-prev">
        <span class="prev"></span>
        ${c.unread_count ? `<span class="badge">${c.unread_count}</span>` : ''}
        ${!c.window_open ? '<span class="shut" title="24h reply window closed">🔒</span>' : ''}
      </div>`;
    b.querySelector('.conv-name').textContent = name;
    const prev = b.querySelector('.conv-prev .prev');
    prev.textContent = `${arrow}${icon ? icon + ' ' : ''}${c.last_preview || ''}`;
    prev.dir = dirOf(c.last_preview);

    b.addEventListener('click', () => openThread(c.phone));
    box.appendChild(b);
  }
}

$('filterBtn').addEventListener('click', (e) => {
  S.unreadOnly = !S.unreadOnly;
  e.target.setAttribute('aria-pressed', String(S.unreadOnly));
  loadConvs();
});

// ===========================================================================
// THREAD
// ===========================================================================
async function openThread(phone, keepScroll = false) {
  S.phone = phone;
  $('placeholder').hidden = true;
  $('threadView').hidden = false;
  if (innerWidth <= 820) {
    $('list').classList.add('hide-mobile');
    $('thread').classList.remove('hide-mobile');
  }

  const { ok, data } = await api('/api/inbox/thread/' + encodeURIComponent(phone));
  if (!ok) return;

  const c = data.conversation || {};
  $('tName').textContent = c.display_name || '+' + phone;
  $('tPhone').textContent = '+' + phone + (c.society_id ? ' · society ' + c.society_id : '');

  const win = $('tWin');
  win.textContent = fmtWindow(c.window_minutes_left, c.window_open);
  win.className = 'win' + (c.window_open ? '' : ' off');

  // Order context — the answer to "meri bag kahan hai" is right here.
  const ctx = $('tCtx');
  if (data.orders?.length) {
    ctx.hidden = false;
    ctx.innerHTML = data.orders.map((o) =>
      `<span><b>${o.order_number}</b> ${o.status}` +
      (o.grand_total ? ` · Rs ${Math.round(o.grand_total).toLocaleString('en-PK')}` :
        o.ceiling_total ? ` · max Rs ${Math.round(o.ceiling_total).toLocaleString('en-PK')}` : '') +
      (o.cycle_code ? ` · ${o.cycle_code}` : '') + `</span>`
    ).join('');
  } else {
    ctx.hidden = true;
  }

  renderMsgs(data.messages || [], keepScroll);
  setComposer(c);

  // The server clears the unread badge when it serves a thread, so all that is
  // left to do here is refresh the list so the badge disappears on screen.
  if (!keepScroll) loadConvs();
}

function renderMsgs(msgs, keepScroll) {
  const box = $('msgs');
  const wasNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  box.innerHTML = '';
  let lastDay = '';

  for (const m of msgs) {
    const day = m.at ? new Date(m.at).toDateString() : '';
    if (day && day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'day';
      d.textContent = new Date(m.at).toLocaleDateString('en-PK',
        { weekday: 'short', day: 'numeric', month: 'short' });
      box.appendChild(d);
      lastDay = day;
    }

    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.direction === 'outbound' ? 'out' : 'in');

    const bub = document.createElement('div');
    bub.className = 'bub';

    if (m.template_name) {
      const t = document.createElement('div');
      t.className = 'tmpl';
      t.textContent = 'template · ' + m.template_name;
      bub.appendChild(t);
    }

    // Media: images inline, voice notes as a player. Both stream through our
    // own proxy because Meta's download URLs expire in minutes.
    if (m.media_id && /^image\//.test(m.media_mime || '')) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = '/api/inbox/media/' + m.media_id;
      img.alt = m.body_preview || 'photo';
      bub.appendChild(img);
    } else if (m.media_id && /^(audio|video)\//.test(m.media_mime || '')) {
      const el = document.createElement(m.media_mime.startsWith('audio') ? 'audio' : 'video');
      el.controls = true;
      el.preload = 'none';
      el.src = '/api/inbox/media/' + m.media_id;
      bub.appendChild(el);
    } else if (m.media_id) {
      const a = document.createElement('a');
      a.href = '/api/inbox/media/' + m.media_id;
      a.textContent = '📄 Download attachment';
      a.target = '_blank';
      a.rel = 'noopener';
      bub.appendChild(a);
    }

    const showText = !(m.media_id && /^(\((image|audio|video|document|sticker)\)|\(voice note\))$/.test(m.body_preview || ''));
    if (showText && m.body_preview) {
      const p = document.createElement('div');
      p.textContent = m.body_preview;
      p.dir = dirOf(m.body_preview);
      if (p.dir === 'rtl') bub.dir = 'rtl';
      bub.appendChild(p);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const ticks = m.direction === 'outbound'
      ? (m.read_at ? ' ✓✓' : m.delivered_at ? ' ✓✓' : m.status === 'sent' ? ' ✓' : m.status === 'failed' ? ' ⚠' : '')
      : '';
    meta.textContent =
      (m.at ? new Date(m.at).toLocaleTimeString('en-PK', { hour: 'numeric', minute: '2-digit' }) : '') +
      (m.agent ? ' · ' + m.agent : '') +
      ticks +
      (m.error_code ? ' · err ' + m.error_code : '');

    wrap.appendChild(bub);
    wrap.appendChild(meta);
    box.appendChild(wrap);
  }

  if (!keepScroll || wasNearBottom) box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------------------
// The composer is the one place the 24-hour rule becomes visible. Rather than
// letting someone type a reply and get a 131047 rejection, the box locks and
// says what to do instead.
// ---------------------------------------------------------------------------
const QUICK = [
  'Assalam o Alaikum! ASB se baat kar rahe hain. Kaise madad kar sakte hain?',
  'Ji, aap ka order confirm hai. Delivery Community Day par ho gi. 🙏',
  'Rates kal subah mandi ke baad final hotay hain — aap ko bill bhej denge.',
  'Shukriya! Koi aur cheez chahiye to bata dein.',
];

function setComposer(c) {
  const open = Boolean(c.window_open);
  $('box').disabled = !open;
  $('send').disabled = !open;
  $('box').placeholder = open ? 'Type a reply…' : 'Reply window closed';

  const note = $('closedNote');
  if (open) {
    note.hidden = true;
  } else {
    note.hidden = false;
    note.className = 'closed';
    note.innerHTML =
      '<b>24-hour reply window is closed</b>' +
      'WhatsApp only allows free typing within 24 hours of the customer\'s last ' +
      'message. Send an approved template instead — that reopens the window.';
  }

  const q = $('quick');
  q.innerHTML = '';
  if (open) {
    for (const text of QUICK) {
      const b = document.createElement('button');
      b.textContent = text.length > 34 ? text.slice(0, 32) + '…' : text;
      b.title = text;
      b.addEventListener('click', () => {
        $('box').value = text;
        $('box').focus();
        autoGrow();
      });
      q.appendChild(b);
    }
  } else {
    for (const t of ['order_confirmed', 'final_bill']) {
      const b = document.createElement('button');
      b.textContent = '↻ ' + t;
      b.title = 'Send the approved ' + t + ' template to reopen the conversation';
      b.addEventListener('click', () => sendTemplate(t));
      q.appendChild(b);
    }
  }
}

function autoGrow() {
  const b = $('box');
  b.style.height = 'auto';
  b.style.height = Math.min(b.scrollHeight, 140) + 'px';
}
$('box').addEventListener('input', autoGrow);
$('box').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
$('send').addEventListener('click', doSend);
$('backBtn').addEventListener('click', () => {
  $('list').classList.remove('hide-mobile');
  $('thread').classList.add('hide-mobile');
  S.phone = null;
  renderConvs(S.convs.reduce((n, c) => n + (c.unread_count || 0), 0));
});

async function doSend() {
  const body = $('box').value.trim();
  if (!body || !S.phone) return;

  $('send').disabled = true;
  const { ok, data } = await api('/api/inbox/reply', {
    method: 'POST',
    body: JSON.stringify({ phone: S.phone, body, agent: S.agent }),
  });
  $('send').disabled = false;

  if (!ok) {
    if (data?.error === 'window_closed') {
      toast('Window closed while you were typing — send a template instead.', 6000);
      openThread(S.phone, true);
    } else {
      toast(data?.message || 'Could not send', 6000);
    }
    return;
  }

  $('box').value = '';
  autoGrow();
  openThread(S.phone, true);
  loadConvs();
}

async function sendTemplate(name) {
  if (!S.phone) return;
  if (!confirm(`Send the "${name}" template to +${S.phone}?\n\nThis is a paid message and reopens the 24-hour window.`)) return;

  const { ok, data } = await api('/api/inbox/template', {
    method: 'POST',
    // No parameters sent from here on purpose: a template fired blind with
    // guessed values reaches a real customer. Templates with {{n}} slots
    // belong in the pipeline, which knows the order. This path is for
    // parameter-free re-engagement templates.
    body: JSON.stringify({ phone: S.phone, template: name, params: [], agent: S.agent }),
  });
  if (!ok) {
    toast(data?.message || 'Template rejected by Meta', 7000);
    return;
  }
  toast('Template sent');
  openThread(S.phone, true);
  loadConvs();
}

// ===========================================================================
// POLL
// ===========================================================================
async function tick() {
  if (document.hidden) return;   // don't poll a backgrounded tab
  await loadConvs();
  if (S.phone) await openThread(S.phone, true);
}

// ===========================================================================
// BOOT
// ===========================================================================
(async function boot() {
  S.agent = store.get('asb_agent', 'asb');
  $('who').value = S.agent === 'asb' ? '' : S.agent;

  const { data } = await api('/api/inbox/me');
  if (data?.signedIn) showApp(); else showLogin();
})();
</script>
