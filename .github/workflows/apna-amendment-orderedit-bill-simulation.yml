name: ASB Phase 3 Order Edit and Bill Simulation
on:
  push:
    branches:
      - feature/apna-amendment-orderedit-reconcile-sim-v1-20261110
  pull_request:
    paths:
      - 'checkout/apna-amendment-orderedit-simulation-v1.js'
      - 'checkout/apna-amendment-bill-simulation-pg-v1.js'
      - 'db/migrations/027_apna_amendment_bill_simulations.sql'
      - 'test/adr002-apna-orderedit-simulation.test.js'
      - 'test/adr002-apna-amendment-bill-simulation-pg.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edit-bill-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:54330
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Confirm migrations 026 and 027 remain held
        run: |
          grep -Fxq '026_apna_amendment_reservations.sql' db/migrations/HOLD
          grep -Fxq '027_apna_amendment_bill_simulations.sql' db/migrations/HOLD
      - name: Run Phase 3 simulated Shopify edit and PostgreSQL bill tests
        run: node --test --test-concurrency=1 test/adr002-apna-orderedit-simulation.test.js test/adr002-apna-amendment-bill-simulation-pg.test.js test/adr002-apna-order-amendment-preflight.test.js test/adr002-apna-amendment-reservation-pg.test.js
