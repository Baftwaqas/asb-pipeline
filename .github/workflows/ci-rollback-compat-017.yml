name: CI - Rollback Compat 017

on:
  push:
    branches:
      - rollback-compat-017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:54330
      PGSSLMODE: disable
      GOLDEN_BASE_REF: 3296c0f9acac8f645eda2c52e9ab3e1cdfa8c56e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
