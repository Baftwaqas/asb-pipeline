name: ASB Lab DB Migration Read-Only Gate
on:
  push:
    branches:
      - safety/lab-db-migration-audit-20261112
  pull_request:
    paths:
      - 'scripts/lab-db-migration-audit-readonly-v1.js'
      - 'checkout/lab-bridge-server.js'
      - 'test/adr002-lab-db-migration-readonly-audit.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check scripts/lab-db-migration-audit-readonly-v1.js
          node --check checkout/lab-bridge-server.js
      - name: Test isolated database and no-backup gate (no DB credentials)
        run: node --test test/adr002-lab-db-migration-readonly-audit.test.js
      - name: Assert migrations remain held
        run: |
          for f in 026_apna_amendment_reservations.sql 027_apna_amendment_bill_simulations.sql 028_apna_edit_commit_intents.sql 029_lab_signed_apna_amendments.sql 030_lab_apna_commit_and_bill_history.sql; do
            grep -Fxq "$f" db/migrations/HOLD
          done
      - name: Verify read-only audit script has no SQL writes
        run: |
          ! grep -Eiq 'await cli\.query\("(INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|TRUNCATE)' scripts/lab-db-migration-audit-readonly-v1.js
          grep -q 'BEGIN READ ONLY' scripts/lab-db-migration-audit-readonly-v1.js
