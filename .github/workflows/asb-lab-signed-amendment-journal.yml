name: ASB Lab Signed Amendment Journal — scratch PG only
on:
  push:
    branches:
      - feature/apna-lab-signed-amendment-journal-v1-20261112
  pull_request:
    paths:
      - 'checkout/lab-apna-signed-amendment-pg-v1.js'
      - 'db/migrations/029_lab_signed_apna_amendments.sql'
      - 'db/migrations/HOLD'
      - 'test/adr002-lab-signed-amendment-pg.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-amendment-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54349:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:54349
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Assert 026-029 migration hold
        run: |
          grep -Fxq '026_apna_amendment_reservations.sql' db/migrations/HOLD
          grep -Fxq '027_apna_amendment_bill_simulations.sql' db/migrations/HOLD
          grep -Fxq '028_apna_edit_commit_intents.sql' db/migrations/HOLD
          grep -Fxq '029_lab_signed_apna_amendments.sql' db/migrations/HOLD
      - name: Test signed authorization and synthetic no-write invariants
        run: node --test --test-concurrency=1 test/adr002-lab-signed-amendment-pg.test.js test/adr002-apna-order-amendment-preflight.test.js
